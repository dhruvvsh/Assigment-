server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The browser only talks to this server; API calls are forwarded to the backend container,
  # which is why the app needs no CORS configuration.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Single-page app: unknown paths (e.g. /projects/3 on refresh) load index.html and React Router takes over.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
