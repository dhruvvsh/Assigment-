# Local PostgreSQL for development: `docker compose up -d db`
# The backend and frontend services are added in the final part.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: ${DB_USERNAME:-taskflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taskflow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-taskflow} -d taskflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
