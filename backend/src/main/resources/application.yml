spring:
  application:
    name: taskflow
  config:
    # Optional git-ignored backend/.env file (KEY=value lines) so credentials such as the
    # Supabase connection never live in code. Real environment variables also work.
    import: optional:file:.env[.properties]
  datasource:
    # Defaults match the Postgres container in the root docker-compose.yml.
    # Set DB_URL / DB_USERNAME / DB_PASSWORD (e.g. in backend/.env) to use Supabase instead.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD:taskflow}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    # Must be at least 32 characters. The fallback is for local development only;
    # always set JWT_SECRET in any shared or deployed environment.
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

server:
  port: ${PORT:8080}
